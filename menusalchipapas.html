    <main>
    <div class="container-base">🍟 Elige tu base:
        <div class="base">
            <ul>
                <li>
                    <label>
                        <input type="radio" name="base-papa" class="base-seleccionada" 
                               data-nombre="Personal" data-precio="14000" data-limite-t="2" data-limite-s="2">
                        Personal: 2 toppings y 2 salsas ($14.000)
                    </label>
                </li>
                <li>
                    <label>
                        <input type="radio" name="base-papa" class="base-seleccionada" 
                               data-nombre="Sencilla" data-precio="15000" data-limite-t="3" data-limite-s="3">
                        Sencilla: 3 toppings y 3 salsas ($15.000)
                    </label>
                </li>
                <li>
                    <label>
                        <input type="radio" name="base-papa" class="base-seleccionada" 
                               data-nombre="Big Mix" data-precio="20000" data-limite-t="3" data-limite-s="4">
                        Big Mix: 3 toppings y 4 salsas ($20.000)
                    </label>
                </li>
                <li>
                    <label>
                        <input type="radio" name="base-papa" class="base-seleccionada" 
                               data-nombre="Mix Familiar" data-precio="26000" data-limite-t="4" data-limite-s="5">
                        Mix Familiar: 4 toppings y 5 salsas ($26.000)
                    </label>
                </li>
            </ul>
        </div>
    </div>

    <div class="container-toppings">🥓 Añade toppings:
        <div class="toppings">
            <ul>
                <li><label><input type="checkbox" class="topping" value="Salchicha"> Salchicha</label></li>
                <li><label><input type="checkbox" class="topping" value="Chorizo"> Chorizo</label></li>
                <li><label><input type="checkbox" class="topping" value="Jamón"> Jamón</label></li>
                <li><label><input type="checkbox" class="topping" value="Queso"> Queso</label></li>
                <li><label><input type="checkbox" class="topping" value="Cebolla"> Cebolla</label></li>
                <li><label><input type="checkbox" class="topping" value="Tomate"> Tomate</label></li>
            </ul>
        </div>
    </div>

    <div class="container-Salsas">🌶️ No te olvides de las salsas:
        <div class="Salsas">
            <ul>
                <li><label><input type="checkbox" class="salsa" value="BBQ"> BBQ</label></li>
                <li><label><input type="checkbox" class="salsa" value="Tártara"> Tártara</label></li>
                <li><label><input type="checkbox" class="salsa" value="Piña"> Piña</label></li>
                <li><label><input type="checkbox" class="salsa" value="Salsa rosada"> Salsa rosada</label></li>
                <li><label><input type="checkbox" class="salsa" value="Salsa de ajo"> Salsa de ajo</label></li>
            </ul>
        </div>
    </div>

    <button id="btn-agregar-salchipapa" style="margin: 20px; padding: 10px; background: #ffc107; border: none; cursor: pointer; font-weight: bold;">
        AGREGAR AL PEDIDO
    </button>
